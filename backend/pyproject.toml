[project]
name = "sentinel-vault"
version = "0.1.0"
description = "Permission-aware document assistant: department folders, OpenFGA grants, Qdrant + Postgres hybrid search, local LLM answers with verified citations."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.162",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "qdrant-client>=1.15",
    "docling>=2.140",
    "laya>=0.4.28",
    "torch>=2.4",
    # Pulled in by Docling. Listed directly so it comes from the same CPU index as torch:
    # uv applies [tool.uv.sources] only to direct dependencies, and a PyPI torchvision built
    # for another torch fails at import ("operator torchvision::nms does not exist").
    "torchvision>=0.19",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[tool.uv]
default-groups = ["dev"]

# CPU-only PyTorch wheels for Docling's layout models and Laya. The ROCm setup from Sentinel
# (dependency groups `cpu` / `rocm`) can be added here the same way for the RX 9070 XT.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
